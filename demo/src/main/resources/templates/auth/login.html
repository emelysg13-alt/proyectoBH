<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Backhome</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #4a3f42;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(190, 120, 145, .18);
        }

        .logo {
            text-align: center;
            color: #d9829a;
            font-size: 34px;
            font-weight: bold;
        }

        .descripcion {
            text-align: center;
            color: #806f75;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #edc9d4;
            background: #fffafd;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d9829a;
            box-shadow: 0 0 0 3px #f8dce4;
        }

        .boton {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 14px;
            background: #d9829a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .boton:hover {
            background: #c96f89;
            transform: translateY(-2px);
        }

        .alerta {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            background: #fde3e8;
            color: #9d4057;
        }

        .success {
            background: #e4f4e8;
            color: #427052;
        }

        .registro {
            text-align: center;
            margin-top: 25px;
        }

        .registro a {
            color: #d16f8b;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <div class="login-card">

        <div class="logo">
            🐾 Backhome
        </div>

        <p class="descripcion">
            Bienvenido nuevamente.
            Ayudemos a que cada mascota vuelva a casa.
        </p>

        <div
            th:if="${param.error}"
            class="alerta error">

            Email o contraseña incorrectos.

        </div>

        <div
            th:if="${param.logout}"
            class="alerta success">

            Has cerrado sesión correctamente.

        </div>

        <div
            th:if="${success}"
            class="alerta success"
            th:text="${success}">
        </div>

        <form
            th:action="@{/login}"
            method="post">

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="150"
                    placeholder="correo@ejemplo.com"
                    required>

            </div>

            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required>

            </div>

            <button
                type="submit"
                class="boton">

                Iniciar sesión

            </button>

        </form>

        <div class="registro">

            ¿Todavía no tienes una cuenta?

            <a th:href="@{/registro}">
                Regístrate
            </a>

        </div>

    </div>

</div>

</body>

</html>
