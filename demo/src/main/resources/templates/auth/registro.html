<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BackHome | Crear cuenta</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, rgba(112,72,255,.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(0,212,255,.14), transparent 30%),
                #050816;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 80px 20px;

            overflow-x: hidden;

        }


        /* =========================
           LUCES
        ========================= */

        .glow {

            position: fixed;

            border-radius: 50%;

            filter: blur(130px);

            pointer-events: none;

            z-index: 0;

        }


        .glow-one {

            width: 500px;

            height: 500px;

            background: #7048ff;

            opacity: .25;

            top: -200px;

            left: -180px;

            animation: floatOne 9s ease-in-out infinite;

        }


        .glow-two {

            width: 450px;

            height: 450px;

            background: #00d4ff;

            opacity: .16;

            right: -180px;

            bottom: -180px;

            animation: floatTwo 11s ease-in-out infinite;

        }


        @keyframes floatOne {

            0%, 100% {
                transform: translate(0,0);
            }

            50% {
                transform: translate(100px,80px);
            }

        }


        @keyframes floatTwo {

            0%, 100% {
                transform: translate(0,0);
            }

            50% {
                transform: translate(-90px,-70px);
            }

        }


        /* =========================
           PARTICULAS
        ========================= */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

        }


        .particle {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: .4;

            animation: particleMove linear infinite;

        }


        @keyframes particleMove {

            from {

                transform: translateY(100vh);

                opacity: 0;

            }

            20% {

                opacity: .6;

            }

            80% {

                opacity: .6;

            }

            to {

                transform: translateY(-100px);

                opacity: 0;

            }

        }


        /* =========================
           BOTON VOLVER
        ========================= */

        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            color: #cfd3e2;

            text-decoration: none;

            padding: 11px 17px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,.1);

            background: rgba(255,255,255,.04);

            backdrop-filter: blur(15px);

            transition: .3s;

            z-index: 10;

        }


        .back:hover {

            color: white;

            background: rgba(255,255,255,.1);

            transform: translateX(-3px);

            box-shadow: 0 0 20px rgba(128,101,255,.2);

        }


        /* =========================
           CONTENEDOR
        ========================= */

        .register-container {

            width: 650px;

            max-width: 95%;

            padding: 45px;

            border-radius: 30px;

            background: rgba(13,18,40,.78);

            border: 1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(25px);

            box-shadow:

                0 30px 80px rgba(0,0,0,.45),

                0 0 60px rgba(112,72,255,.08);

            animation: appear .8s ease;

            position: relative;

            z-index: 2;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;

            letter-spacing: -1px;

        }


        .logo span {

            color: #8b72ff;

            text-shadow:
                0 0 20px rgba(139,114,255,.5);

        }


        .subtitle {

            text-align: center;

            color: #858da5;

            font-size: 14px;

            margin-bottom: 30px;

        }


        h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 10px;

        }


        .description {

            text-align: center;

            color: #858da5;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* =========================
           MENSAJES
        ========================= */

        .message {

            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }


        .error {

            background: rgba(255,70,70,.12);

            border: 1px solid rgba(255,70,70,.25);

            color: #ff8b8b;

        }


        .success {

            background: rgba(50,220,120,.12);

            border: 1px solid rgba(50,220,120,.25);

            color: #7dffad;

        }


        /* =========================
           FORMULARIO
        ========================= */

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

        }


        .input-group {

            margin-bottom: 2px;

        }


        .full {

            grid-column: 1 / -1;

        }


        label {

            display: block;

            color: #c5c9d7;

            font-size: 13px;

            margin-bottom: 8px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            opacity: .7;

            pointer-events: none;

        }


        input {

            width: 100%;

            padding: 14px 15px 14px 45px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,.1);

            outline: none;

            background: rgba(255,255,255,.045);

            color: white;

            font-size: 14px;

            transition: .3s;

        }


        input::placeholder {

            color: #70788f;

        }


        input:hover {

            border-color: rgba(255,255,255,.2);

        }


        input:focus {

            border-color: #8065ff;

            background: rgba(255,255,255,.07);

            box-shadow:

                0 0 0 3px rgba(128,101,255,.12),

                0 0 25px rgba(128,101,255,.08);

            transform: translateY(-1px);

        }


        /* =========================
           BOTON REGISTRO
        ========================= */

        .register-button {

            width: 100%;

            border: none;

            padding: 16px;

            margin-top: 25px;

            border-radius: 13px;

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #7657ff,
                    #4c8dff
                );

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:

                0 10px 30px
                rgba(101,78,255,.25);

            transition: .3s;

            overflow: hidden;

            position: relative;

        }


        .register-button::before {

            content: "";

            position: absolute;

            width: 70%;

            height: 100%;

            left: -100%;

            top: 0;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: .6s;

        }


        .register-button:hover::before {

            left: 130%;

        }


        .register-button:hover {

            transform: translateY(-3px);

            box-shadow:

                0 15px 40px
                rgba(101,78,255,.45);

        }


        .register-button:active {

            transform: scale(.98);

        }


        /* =========================
           LOGIN
        ========================= */

        .login {

            text-align: center;

            margin-top: 25px;

            color: #777f96;

            font-size: 14px;

        }


        .login a {

            color: #a38fff;

            font-weight: 600;

            text-decoration: none;

            transition: .3s;

        }


        .login a:hover {

            color: white;

            text-shadow: 0 0 15px rgba(163,143,255,.7);

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            .register-container {

                padding: 30px 25px;

            }

            .form-grid {

                grid-template-columns: 1fr;

            }

            .full {

                grid-column: auto;

            }

            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- LUCES -->

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>


    <!-- PARTICULAS -->

    <div
        class="particles"
        id="particles">
    </div>


    <!-- VOLVER -->

    <a
        href="/"
        class="back">

        ← Volver

    </a>


    <!-- CONTENEDOR -->

    <div class="register-container">


        <!-- LOGO -->

        <div class="logo">

            Back<span>Home</span>

        </div>


        <div class="subtitle">

            Construye tu próximo capítulo

        </div>


        <h1>

            Crear cuenta ✨

        </h1>


        <p class="description">

            Regístrate y comienza tu experiencia en BackHome.

        </p>


        <!-- MENSAJE DE ERROR -->

        <div
            th:if="${error}"
            class="message error"
            th:text="${error}">

            Error al registrar usuario.

        </div>


        <!-- MENSAJE DE ÉXITO -->

        <div
            th:if="${success}"
            class="message success"
            th:text="${success}">

            Registro exitoso.

        </div>


        <!-- FORMULARIO -->

        <form
            action="/registro"
            method="post"
            id="registroForm">


            <div class="form-grid">


                <!-- NOMBRE -->

                <div class="input-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            autocomplete="given-name"
                            required>

                    </div>

                </div>


                <!-- APELLIDO -->

                <div class="input-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            autocomplete="family-name"
                            required>

                    </div>

                </div>


                <!-- DOCUMENTO -->

                <div class="input-group">

                    <label for="documento">
                        Documento
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🪪
                        </span>

                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            placeholder="Número de documento"
                            required>

                    </div>

                </div>


                <!-- TELEFONO -->

                <div class="input-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            📱
                        </span>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="Tu teléfono"
                            autocomplete="tel">

                    </div>

                </div>


                <!-- CORREO -->

                <div class="input-group full">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una contraseña"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repite tu contraseña"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>

                </div>


            </div>


            <!-- BOTON -->

            <button
                type="submit"
                class="register-button">

                Crear mi cuenta 🚀

            </button>


        </form>


        <!-- IR AL LOGIN -->

        <div class="login">

            ¿Ya tienes una cuenta?

            <a href="/login">

                Iniciar sesión

            </a>

        </div>


    </div>


    <script>

        /* =========================
           PARTICULAS
        ========================= */

        const container =
            document.getElementById("particles");


        for (let i = 0; i < 70; i++) {

            const particle =
                document.createElement("div");


            particle.classList.add("particle");


            particle.style.left =
                Math.random() * 100 + "%";


            particle.style.animationDuration =
                (5 + Math.random() * 10) + "s";


            particle.style.animationDelay =
                Math.random() * 10 + "s";


            particle.style.opacity =
                Math.random() * .6;


            container.appendChild(particle);

        }


        /* =========================
           VALIDAR CONTRASEÑAS
        ========================= */

        const form =
            document.getElementById("registroForm");


        form.addEventListener("submit", function(event) {


            const password =
                document.getElementById("password").value;


            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                event.preventDefault();

                alert("Las contraseñas no coinciden.");

                return;

            }


            if (password.length < 6) {

                event.preventDefault();

                alert("La contraseña debe tener mínimo 6 caracteres.");

            }

        });

    </script>


</body>

</html>
