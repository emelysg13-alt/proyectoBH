<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Backhome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #4a3f42;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .registro {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(190, 120, 145, .18);
        }

        .logo {
            text-align: center;
            color: #d9829a;
            font-size: 32px;
            font-weight: bold;
        }

        .subtitulo {
            text-align: center;
            margin-bottom: 30px;
            color: #806f75;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #edc9d4;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #fffafd;
        }

        input:focus,
        select:focus {
            border-color: #d9829a;
            box-shadow: 0 0 0 3px #f8dce4;
        }

        .boton {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 14px;
            background: #d9829a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .boton:hover {
            transform: translateY(-2px);
            background: #c96f89;
        }

        .alerta {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            background: #fde3e8;
            color: #9d4057;
        }

        .success {
            background: #e4f4e8;
            color: #427052;
        }

        .login {
            text-align: center;
            margin-top: 22px;
        }

        .login a {
            color: #d16f8b;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .fila {
                grid-template-columns: 1fr;
            }

            .registro {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="registro">

        <div class="logo">
            🐾 Backhome
        </div>

        <p class="subtitulo">
            Crea tu cuenta y ayuda a reunir mascotas con sus familias.
        </p>

        <div
            th:if="${error}"
            class="alerta error"
            th:text="${error}">
        </div>

        <form
            th:action="@{/registro}"
            method="post">

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <div class="fila">

                <div class="campo">

                    <label for="t_documento_id">
                        Tipo de documento
                    </label>

                    <select
                        id="t_documento_id"
                        name="t_documento_id"
                        required>

                        <option value="">
                            Selecciona
                        </option>

                        <option value="CC">
                            Cédula de ciudadanía
                        </option>

                        <option value="TI">
                            Tarjeta de identidad
                        </option>

                        <option value="CE">
                            Cédula de extranjería
                        </option>

                    </select>

                </div>

                <div class="campo">

                    <label for="n_documento">
                        Número de documento
                    </label>

                    <input
                        type="text"
                        id="n_documento"
                        name="n_documento"
                        maxlength="20"
                        required>

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label for="primer_nombre">
                        Primer nombre
                    </label>

                    <input
                        type="text"
                        id="primer_nombre"
                        name="primer_nombre"
                        maxlength="100"
                        required>

                </div>

                <div class="campo">

                    <label for="segundo_nombre">
                        Segundo nombre
                    </label>

                    <input
                        type="text"
                        id="segundo_nombre"
                        name="segundo_nombre"
                        maxlength="100">

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label for="primer_apellido">
                        Primer apellido
                    </label>

                    <input
                        type="text"
                        id="primer_apellido"
                        name="primer_apellido"
                        maxlength="100"
                        required>

                </div>

                <div class="campo">

                    <label for="segundo_apellido">
                        Segundo apellido
                    </label>

                    <input
                        type="text"
                        id="segundo_apellido"
                        name="segundo_apellido"
                        maxlength="100">

                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="150"
                        required>

                </div>

                <div class="campo">

                    <label for="numero_tel">
                        Número de teléfono
                    </label>

                    <input
                        type="tel"
                        id="numero_tel"
                        name="numero_tel"
                        maxlength="20"
                        required>

                </div>

            </div>

            <div class="campo">

                <label for="estrato">
                    Estrato
                </label>

                <select
                    id="estrato"
                    name="estrato">

                    <option value="">
                        Selecciona tu estrato
                    </option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>

                </select>

            </div>

            <div class="fila">

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required>

                </div>

                <div class="campo">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="boton">

                Crear cuenta 🐾

            </button>

        </form>

        <div class="login">

            ¿Ya tienes una cuenta?

            <a th:href="@{/login}">
                Iniciar sesión
            </a>

        </div>

    </div>

</div>

</body>
</html>
